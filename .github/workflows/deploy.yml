name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - claude/deploy-cloudflare-*
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Debug - Check if secrets are available
        run: |
          echo "Checking secrets availability..."
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is EMPTY or NOT SET"
          else
            echo "✅ CLOUDFLARE_API_TOKEN is available (length: ${#CLOUDFLARE_API_TOKEN})"
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is EMPTY or NOT SET"
          else
            echo "✅ CLOUDFLARE_ACCOUNT_ID is available"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure secrets (if provided)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOLTBOT_GATEWAY_TOKEN: ${{ secrets.MOLTBOT_GATEWAY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEV_MODE: ${{ secrets.DEV_MODE }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
        run: |
          if [ -n "$MOLTBOT_GATEWAY_TOKEN" ]; then
            echo "$MOLTBOT_GATEWAY_TOKEN" | npx wrangler secret put MOLTBOT_GATEWAY_TOKEN || true
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY || true
          fi
          if [ -n "$DEV_MODE" ]; then
            echo "$DEV_MODE" | npx wrangler secret put DEV_MODE || true
          fi
          if [ -n "$CF_ACCESS_TEAM_DOMAIN" ]; then
            echo "$CF_ACCESS_TEAM_DOMAIN" | npx wrangler secret put CF_ACCESS_TEAM_DOMAIN || true
          fi
          if [ -n "$CF_ACCESS_AUD" ]; then
            echo "$CF_ACCESS_AUD" | npx wrangler secret put CF_ACCESS_AUD || true
          fi

      - name: Output deployment info
        run: |
          echo "✅ Deploy completed successfully!"
          echo ""
          echo "🔗 Your worker is available at: https://moltworker.workers.dev"
          echo ""
          if [ -n "${{ secrets.MOLTBOT_GATEWAY_TOKEN }}" ]; then
            echo "🔑 Access the Control UI with your gateway token"
          else
            echo "⚠️  Don't forget to configure MOLTBOT_GATEWAY_TOKEN secret!"
          fi

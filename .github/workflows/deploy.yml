name: Deploy site-sales-os to Cloudflare

on:
  push:
    branches:
      - claude/deploy-cloudflare-site-sales-os
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sales-os-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy with retry
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/wrangler-output.txt
          success=0
          for attempt in 1 2 3; do
            echo "=== wrangler 4.124.0 attempt $attempt ===" | tee -a /tmp/wrangler-output.txt
            if npx --yes wrangler@4.124.0 deploy 2>&1 | tee -a /tmp/wrangler-output.txt; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$success" = "1"
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-output.txt | tail -n 1 || true)
          printf '%s\n' "$URL" > /tmp/url.txt
          test -n "$URL"
      - name: Verify v9 APIs after propagation
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          URL=$(cat /tmp/url.txt)
          sleep 8
          curl -sS -H 'cache-control: no-cache' -o /tmp/health.json "$URL/api/health?check=v9" || true
          curl -sS -H 'cache-control: no-cache' -o /tmp/leads.json -X POST "$URL/api/leads?check=v9" -H 'content-type: application/json' --data '{"city":"São Paulo","niche":"lawyer","radius":7000}' || true
          curl -sS -H 'cache-control: no-cache' -o /tmp/verify.json -X POST "$URL/api/verify-websites?check=v9" -H 'content-type: application/json' --data '{"leads":[{"id":"mattos-filho-test","name":"Mattos & Filho Advogados","address":"São Paulo, SP","type":"lawyer","verificationBasis":"foursquare","email":"","website":""}]}' || true
      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy-results-site-sales-os
          git checkout deploy-results-site-sales-os
          {
            printf 'deploy_outcome=%s\n' "${{ steps.deploy.outcome }}"
            printf -- '---wrangler---\n'
            cat /tmp/wrangler-output.txt 2>/dev/null || true
            printf -- '\n---health---\n'
            cat /tmp/health.json 2>/dev/null || true
            printf -- '\n---leads---\n'
            cat /tmp/leads.json 2>/dev/null || true
            printf -- '\n---verify-mattos-filho---\n'
            cat /tmp/verify.json 2>/dev/null || true
          } > site-sales-os-deploy-debug.txt
          git add site-sales-os-deploy-debug.txt
          git commit -m "Record v9 wrangler 4.124 diagnostics [skip deploy]" || true
          git push origin deploy-results-site-sales-os

name: Deploy site-sales-os to Cloudflare

on:
  push:
    branches:
      - claude/deploy-cloudflare-site-sales-os
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Worker and verify search
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-output.txt
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-output.txt | tail -n 1 || true)
          test -n "$URL"
          printf '%s\n' "$URL" > /tmp/url.txt
      - name: Verify search API
        shell: bash
        run: |
          URL=$(cat /tmp/url.txt)
          curl -sS -D /tmp/headers.txt -o /tmp/leads.json -X POST "$URL/api/leads" \
            -H 'content-type: application/json' \
            --data '{"city":"São Paulo","niche":"dentist","radius":7000}' || true
          printf 'url=%s\n' "$URL" > /tmp/result.txt
          printf -- '---headers---\n' >> /tmp/result.txt
          cat /tmp/headers.txt >> /tmp/result.txt || true
          printf -- '\n---body---\n' >> /tmp/result.txt
          head -c 12000 /tmp/leads.json >> /tmp/result.txt || true
      - name: Record result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy-results-site-sales-os
          git checkout deploy-results-site-sales-os
          cp /tmp/result.txt site-sales-os-search-debug.txt
          git add site-sales-os-search-debug.txt
          git commit -m "Record search API debug [skip deploy]" || true
          git push origin deploy-results-site-sales-os

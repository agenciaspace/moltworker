name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - claude/deploy-cloudflare-*
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Configure secrets (if provided)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOLTBOT_GATEWAY_TOKEN: ${{ secrets.MOLTBOT_GATEWAY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$MOLTBOT_GATEWAY_TOKEN" ]; then
            echo "$MOLTBOT_GATEWAY_TOKEN" | npx wrangler secret put MOLTBOT_GATEWAY_TOKEN || true
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY || true
          fi

      - name: Output deployment info
        run: |
          echo "✅ Deploy completed successfully!"
          echo ""
          echo "🔗 Your worker is available at: https://moltbot-sandbox.workers.dev"
          echo ""
          if [ -n "${{ secrets.MOLTBOT_GATEWAY_TOKEN }}" ]; then
            echo "🔑 Access the Control UI with your gateway token"
          else
            echo "⚠️  Don't forget to configure MOLTBOT_GATEWAY_TOKEN secret!"
          fi

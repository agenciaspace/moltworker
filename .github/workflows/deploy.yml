name: Deploy site-sales-os to NEW Cloudflare account

on:
  push:
    branches:
      - claude/deploy-cloudflare-site-sales-os
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sales-os-new-account-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN_NEW != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Deploy Worker to new Cloudflare account
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_NEW }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/wrangler-output.txt
          success=0
          for attempt in 1 2 3; do
            echo "=== wrangler 4.124.0 attempt $attempt ===" | tee -a /tmp/wrangler-output.txt
            if npx --yes wrangler@4.124.0 deploy 2>&1 | tee -a /tmp/wrangler-output.txt; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$success" = "1"
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-output.txt | tail -n 1 || true)
          test -n "$URL"
          printf '%s\n' "$URL" > /tmp/url.txt

      - name: Configure TomTom secret
        if: ${{ secrets.TOMTOM_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_NEW }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        shell: bash
        run: |
          printf '%s' "$TOMTOM_API_KEY" | npx --yes wrangler@4.124.0 secret put TOMTOM_API_KEY

      - name: Configure Brave secret when available
        if: ${{ secrets.BRAVE_SEARCH_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_NEW }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        shell: bash
        run: |
          printf '%s' "$BRAVE_SEARCH_API_KEY" | npx --yes wrangler@4.124.0 secret put BRAVE_SEARCH_API_KEY

      - name: Verify production
        shell: bash
        run: |
          URL=$(cat /tmp/url.txt)
          sleep 8
          curl -fsS -H 'cache-control: no-cache' "$URL/api/health?check=new-account" | tee /tmp/health.json
          curl -fsS -H 'cache-control: no-cache' -o /tmp/leads.json -X POST "$URL/api/leads?check=new-account" \
            -H 'content-type: application/json' \
            --data '{"city":"São Paulo","niche":"dentist","radius":7000}'

      - name: Record new-account deployment result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy-results-site-sales-os
          git checkout deploy-results-site-sales-os
          {
            printf 'new_account_deploy=true\n'
            printf 'url='; cat /tmp/url.txt 2>/dev/null || true
            printf '\n---health---\n'
            cat /tmp/health.json 2>/dev/null || true
            printf '\n---leads---\n'
            head -c 12000 /tmp/leads.json 2>/dev/null || true
          } > site-sales-os-new-account.txt
          git add site-sales-os-new-account.txt
          git commit -m "Record new Cloudflare account deployment [skip deploy]" || true
          git push origin deploy-results-site-sales-os

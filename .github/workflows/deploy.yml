name: Deploy site-sales-os to Cloudflare

on:
  push:
    branches:
      - claude/deploy-cloudflare-site-sales-os
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sales-os-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-output.txt
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-output.txt | tail -n 1 || true)
          printf '%s\n' "$URL" > /tmp/url.txt
      - name: Verify APIs
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          URL=$(cat /tmp/url.txt)
          curl -sS -o /tmp/health.json "$URL/api/health" || true
          curl -sS -o /tmp/leads.json -X POST "$URL/api/leads" \
            -H 'content-type: application/json' \
            --data '{"city":"São Paulo","niche":"dentist","radius":7000}' || true
          curl -sS -o /tmp/fallback.json -X POST "$URL/api/fallback-leads" \
            -H 'content-type: application/json' \
            --data '{"city":"São Paulo","niche":"dentist"}' || true
      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy-results-site-sales-os
          git checkout deploy-results-site-sales-os
          {
            printf 'deploy_outcome=%s\n' "${{ steps.deploy.outcome }}"
            printf -- '---wrangler---\n'
            cat /tmp/wrangler-output.txt 2>/dev/null || true
            printf -- '\n---health---\n'
            cat /tmp/health.json 2>/dev/null || true
            printf -- '\n---leads---\n'
            cat /tmp/leads.json 2>/dev/null || true
            printf -- '\n---fallback---\n'
            cat /tmp/fallback.json 2>/dev/null || true
          } > site-sales-os-deploy-debug.txt
          git add site-sales-os-deploy-debug.txt
          git commit -m "Record deploy diagnostics [skip deploy]" || true
          git push origin deploy-results-site-sales-os
